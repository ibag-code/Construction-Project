<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft</title>
    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />

    <link rel="stylesheet" href="/Craft-style/signup-verify.css">

    <link rel="icon" type="image/png" href="images/FAVICON.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>


    <div class="the-form">
        <div class="arrow-back">
            <i class="hgi hgi-stroke hgi-rounded hgi-arrow-left-01"></i>
        </div>

        <div class="verify-text">
            <h3>Verify your email</h3>
            <p>The verification code has been sent to your email craft@gmail.com</p>
        </div>

        <form id="otpForm">
            <div class="otp-countdown">


                <div class="otp-inputs">
                    <input type="text" class="otp-field" inputmode="numeric" maxlength="1" required />
                    <input type="text" class="otp-field" inputmode="numeric" maxlength="1" required />
                    <input type="text" class="otp-field" inputmode="numeric" maxlength="1" required />
                    <input type="text" class="otp-field" inputmode="numeric" maxlength="1" required />
                    <input type="text" class="otp-field" inputmode="numeric" maxlength="1" required />
                    <input type="text" class="otp-field" inputmode="numeric" maxlength="1" required />
                </div>
                <p class="count-down">
                    Not yet received yet? <span>Resend Verification code </span>
                </p>
            </div>
            <button type="submit" class="verify-btn">Continue</button>
        </form>


    </div>
    </div>
</body>

</html>
